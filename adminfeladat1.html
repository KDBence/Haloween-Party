<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <title>Admin</title>
</head>
<body>
  <h1>Admin oldal</h1>
  <p id="status">Betöltés...</p>
  <form id="form"></form>
  <h2>Beküldött válaszok</h2>
  <div id="answers"></div>
  <script src="script.js"></script>
  <script>
    if (requireLogin() !== 'admin') location.href = 'index.html';
    const form = document.getElementById('form');
    const status = document.getElementById('status');

    async function init() {
      const words = await feladat1LoadWords();
      FELADAT1_KEYS.forEach(key => {
        const input = document.createElement('input');
        input.type = 'text';
        input.id = key;
        input.placeholder = 'Írd be a szót';
        input.required = true;
        input.value = words[key];
        form.append(input, document.createElement('br'));
      });
      const btn = document.createElement('button');
      btn.type = 'submit';
      btn.textContent = 'Mentés';
      form.appendChild(btn);
      status.textContent = '';

      const box = document.getElementById('answers');
      const all = await feladat1LoadAllAnswers();
      const entries = Object.values(all);
      if (!entries.length) box.textContent = 'Még nincs beküldött válasz.';
      entries.forEach(e => {
        const p = document.createElement('p');
        p.textContent = e.name + ': ' + FELADAT1_KEYS.map(k => e.answers[k]).join(', ');
        box.appendChild(p);
      });
    }

    form.addEventListener('submit', async e => {
      e.preventDefault();
      const w = {};
      FELADAT1_KEYS.forEach(k => { w[k] = document.getElementById(k).value; });
      try {
        await feladat1SaveWords(w);
        location.href = 'admin.html';
      } catch (err) {
        status.textContent = err.message;
      }
    });

    init().catch(err => { status.textContent = err.message; });
  </script>
</body>
</html>
